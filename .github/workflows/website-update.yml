name: Website Update
on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [auto-update]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Trigger deepin website update
        run: sleep 60 && curl ${{ secrets.DEEPIN_WEBSITE_WEBHOOK }}
